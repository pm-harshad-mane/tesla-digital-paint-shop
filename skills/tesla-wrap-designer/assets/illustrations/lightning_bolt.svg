<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
<!--
  lightning_bolt.svg - Faceted electric bolt with cyan glow and crackle sparks.
  viewBox 512x512, transparent background, drawn upright. Original artwork.
  Recolour by find/replace of these hex values (keep the case):
       BOLT_LIGHT    #fffbd0  hot facet / core
       BOLT          #ffe03a  bolt body
       BOLT_DARK     #ff8f00  shadow facet
       GLOW          #38c8ff  electric glow
       OUTLINE       #1c1f4a  outline
-->
