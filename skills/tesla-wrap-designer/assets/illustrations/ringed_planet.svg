<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
<!--
  ringed_planet.svg - Lit sphere with banded atmosphere, glow and tilted ring that passes behind and in front.
  viewBox 512x512, transparent background, drawn upright. Original artwork.
  Recolour by find/replace of these hex values (keep the case):
       PLANET_LIGHT  #ffd9a8  sunlit highlight
       PLANET        #ee8a4c  main body
       PLANET_DARK   #5c2447  night side / shadow
       BAND          #b8452f  cloud bands
       RING_LIGHT    #fff1d6  ring highlight
       RING          #e0a868  ring body
       RING_DARK     #8c5a42  ring shade
       GLOW          #ffb98a  atmosphere glow
-->
