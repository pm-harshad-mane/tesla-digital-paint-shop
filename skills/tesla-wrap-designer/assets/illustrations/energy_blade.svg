<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 512" width="256" height="512">
<!--
  energy_blade.svg - Glowing energy-sword beam with a chrome hilt, vertical (aspect 1:2).
  viewBox 256x512, transparent background, drawn upright. Original artwork.
  Recolour by find/replace of these hex values (keep the case):
       BEAM_CORE     #ffffff  white-hot core
       BEAM          #38e8ff  beam colour
       BEAM_GLOW     #0a8bff  outer glow
       METAL_LIGHT   #e6ebf2  hilt highlight
       METAL         #8a94a8  hilt mid
       METAL_DARK    #2a3144  hilt shadow
       GRIP          #1a1f2e  grip rubber
       TRIM          #ffb020  hilt accent ring and button
-->
<defs>
<filter id="eb_b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter><filter id="eb_b2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="eb_m" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a3144"/><stop offset="0.22" stop-color="#e6ebf2"/><stop offset="0.4" stop-color="#8a94a8"/><stop offset="0.7" stop-color="#4a5368"/><stop offset="1" stop-color="#1a1f2e"/></linearGradient>
<linearGradient id="eb_g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0e1220"/><stop offset="0.3" stop-color="#3a4258"/><stop offset="0.55" stop-color="#1a1f2e"/><stop offset="1" stop-color="#080a12"/></linearGradient>
<linearGradient id="eb_t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a36200"/><stop offset="0.3" stop-color="#ffe08a"/><stop offset="0.6" stop-color="#ffb020"/><stop offset="1" stop-color="#7a4500"/></linearGradient>
<linearGradient id="eb_c" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e8ff"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#38e8ff"/></linearGradient>
</defs>
<rect x="68" y="20" width="120" height="330" rx="60" fill="#0a8bff" opacity=".7" filter="url(#eb_b1)"/>
<rect x="92" y="30" width="72" height="320" rx="36" fill="#38e8ff" opacity=".85" filter="url(#eb_b2)"/>
<rect x="104" y="36" width="48" height="330" rx="24" fill="#38e8ff"/>
<rect x="114" y="40" width="28" height="326" rx="14" fill="url(#eb_c)"/>
<rect x="122" y="44" width="12" height="320" rx="6" fill="#fff"/>
<!-- emitter -->
<path d="M96 350 L160 350 L166 392 L90 392 Z" fill="url(#eb_m)" stroke="#10141f" stroke-width="4" stroke-linejoin="round"/>
<rect x="84" y="388" width="88" height="16" rx="5" fill="url(#eb_t)" stroke="#10141f" stroke-width="4"/>
<!-- grip -->
<rect x="98" y="404" width="60" height="30" fill="url(#eb_m)" stroke="#10141f" stroke-width="4"/>
<rect x="100" y="434" width="56" height="64" fill="url(#eb_g)" stroke="#10141f" stroke-width="4"/>
<path d="M100 450H156M100 466H156M100 482H156" stroke="#5a6480" stroke-width="3" opacity=".7"/>
<rect x="116" y="410" width="24" height="12" rx="6" fill="#ffb020" stroke="#10141f" stroke-width="3"/>
<path d="M94 498 L162 498 L156 510 L100 510 Z" fill="url(#eb_m)" stroke="#10141f" stroke-width="4" stroke-linejoin="round"/>
</svg>
